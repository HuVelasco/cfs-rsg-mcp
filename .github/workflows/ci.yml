name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install mcp pytest ruff

      - name: Lint
        run: ruff check cfs_rsg_mcp tests

      # pywin32 / CFS are Windows-only, so CI runs the pure-Python suite only.
      # Live tests (pytest -m live) require a licensed CFS 15 and are run locally.
      - name: Test (non-live)
        run: pytest -m "not live" -q
